<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vite App</title>
  </head>
  <body>
    <div class="creation">
      <h3>Création du compte</h3>
    <input type="text" value="Nom du compte" id="nom">
    <button id="create">Create</button>
    
    </div>
    <div class="operation">
      <h4>Opérations</h4>
    <input type="text" value="Compte" id="compte">
    <input type="text" value="Montant" id="montant">
    <button id="crediter">Créditer</button>
    <button id="debiter">Débiter</button>
    </div>
    <div class="virement">
      <h5>Virements</h5>
    <input type="text" value="Bénéficiaire" id="cible">
    <input type="text" value="Eméteur" id="source">
    <input type="text" value="Montant Virement" id="montantVirement">
    <button id="virement">Virement</button>
    </div>
    <div id="message">Message:</div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
